<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minipuma猫咪治愈参考</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#fbfbfd;--card:#fff;--ink:#1d1d1f;--mut:#86868b;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.12);
--g1:#4285F4;--g2:#9B72CB;--g3:#D96570;--safe:#34a853;--cau:#f5a623;--hi:#ea4335;--radius:22px;}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#98989d;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;line-height:1.55;}
.app{max-width:1000px;margin:0 auto;padding:0 20px 120px;}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);
-webkit-backdrop-filter:saturate(180%) blur(20px);padding:14px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{font-size:22px;}
.brand h1{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0;}
.brand .tag{font-size:12px;color:var(--mut);margin-left:auto;}
.hero{padding:30px 4px 14px;}
.hero h2{font-size:34px;font-weight:600;letter-spacing:-.03em;margin:0 0 6px;
background:linear-gradient(110deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{color:var(--mut);font-size:15px;margin:0;max-width:640px;}
.search{margin:18px 4px 8px;position:relative;}
.search input{width:100%;border:1px solid var(--line2);background:var(--card);color:var(--ink);
border-radius:999px;padding:13px 18px 13px 44px;font-size:15px;outline:none;transition:.2s;}
.search input:focus{border-color:var(--g1);box-shadow:0 0 0 4px color-mix(in srgb,var(--g1) 16%,transparent);}
.search .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:22px;line-height:1;pointer-events:none;}
.search input{padding-left:48px !important;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px;}
.tile{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);
padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
transition:transform .2s cubic-bezier(.4,0,.2,1),box-shadow .2s,border-color .2s;font:inherit;color:inherit;}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.10);border-color:var(--line2);}
.tile .em{font-size:30px;line-height:1;}
.tile .nm{font-size:14px;font-weight:500;letter-spacing:-.01em;}
.tile .em.warn{filter:drop-shadow(0 0 0 transparent);}
.tile{position:relative;}
.tile .refcnt{position:absolute;top:6px;right:8px;font-size:10.5px;color:var(--mut);background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:9px;padding:1.5px 7px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;}
.grid-flat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px;}
.sort-bar{display:flex;align-items:center;gap:8px;margin:12px 2px 2px;padding:8px 10px;background:color-mix(in srgb,var(--mut) 4%,var(--card));border:1px solid var(--line);border-radius:11px;flex-wrap:wrap;}
.sort-lbl{font-size:12px;color:var(--mut);font-weight:500;}
.sort-btn{font:inherit;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.15s;}
.sort-btn:hover{border-color:var(--g1);color:var(--g1);}
.sort-btn.on{background:var(--g1);color:#fff;border-color:var(--g1);font-weight:600;}
.fade{animation:fade .35s cubic-bezier(.4,0,.2,1);}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--g1);font:inherit;
font-size:15px;cursor:pointer;padding:14px 0 6px;}
.dh{padding:6px 2px 4px;}
.dh h2{font-size:27px;font-weight:600;letter-spacing:-.02em;margin:2px 0 4px;}
.emerg{background:color-mix(in srgb,var(--hi) 12%,var(--card));border:1px solid color-mix(in srgb,var(--hi) 35%,transparent);
color:var(--hi);border-radius:16px;padding:11px 15px;font-size:14px;font-weight:500;margin:10px 0;}
.step{margin:22px 2px 8px;display:flex;align-items:center;gap:10px;}
.step .n{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;
font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.step .t{font-size:15px;font-weight:600;letter-spacing:-.01em;}
.step .sub{font-size:12.5px;color:var(--mut);margin-left:auto;}
.seg{display:inline-flex;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:999px;padding:4px;gap:2px;margin:2px 0;}
.seg button{border:none;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--mut);
padding:8px 18px;border-radius:999px;cursor:pointer;transition:.22s;}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);}
.clues{display:flex;flex-wrap:wrap;gap:9px;margin:6px 2px 2px;}
.chip{cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);font:inherit;
font-size:13.5px;border-radius:999px;padding:8px 15px;transition:.18s;user-select:none;}
.chip:hover{border-color:var(--mut);}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff;
box-shadow:0 4px 14px color-mix(in srgb,var(--g2) 35%,transparent);}
.chip .vt{font-size:11px;opacity:.6;margin-left:5px;}
.hint{font-size:12.5px;color:var(--mut);margin:8px 2px 0;}
.causes{display:flex;flex-direction:column;gap:11px;margin-top:6px;}
.cz{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);overflow:hidden;transition:.2s;}
.cz:hover{border-color:var(--line2);}
.cz.open{border-color:var(--g1);box-shadow:0 10px 30px rgba(0,0,0,.08);}
.cz .head{display:flex;align-items:center;gap:12px;padding:15px 17px;cursor:pointer;}
.cz .rank{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;width:18px;flex:0 0 auto;}
.cz .nmwrap{flex:1;min-width:0;}
.cz .nm{font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.cz .bar{height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);margin-top:7px;overflow:hidden;}
.cz .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--g1),var(--g2));width:0;transition:width .5s cubic-bezier(.4,0,.2,1);}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 11px;white-space:nowrap;flex:0 0 auto;}
.pill.dx{background:color-mix(in srgb,var(--safe) 16%,transparent);color:var(--safe);}
.pill.hx{background:color-mix(in srgb,var(--cau) 18%,transparent);color:#b9770e;}
.pill.em{background:color-mix(in srgb,var(--hi) 14%,transparent);color:var(--hi);}
.cz .chev{color:var(--mut);transition:transform .25s;font-size:13px;}
.cz.open .chev{transform:rotate(90deg);}
.drugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:0 17px 17px;}
.drug{border:1px solid var(--line);border-radius:15px;padding:12px 13px;background:color-mix(in srgb,var(--ink) 2.5%,var(--card));}
.drug .dt{display:flex;flex-direction:column;align-items:stretch;gap:6px;}
.drug .dr1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.drug .dr2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);}
.drug .dn{font-size:14px;font-weight:600;letter-spacing:-.01em;word-break:break-word;flex:1 1 auto;min-width:0;}
.drug .de{font-size:11px;color:var(--mut);font-style:italic;}
.drug .cure{font-size:11.5px;font-weight:700;color:#2a5db0;background:color-mix(in srgb,var(--g1) 14%,transparent);
border-radius:999px;padding:2px 9px;white-space:nowrap;flex-shrink:0;}
.drug .dm{font-size:12px;color:var(--ink);margin-top:6px;opacity:.85;}
.drug .dnt{font-size:11.5px;color:var(--mut);margin-top:5px;}
.drug.safe{border-left:5px solid var(--safe);}
.drug.caution{border-left:5px solid var(--cau);}
.drug.high{border-left:5px solid var(--hi);}
.drug.na{border-left:5px solid var(--mut);}
.risk-tag{font-size:10.5px;font-weight:600;border-radius:6px;padding:1.5px 7px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:2px;}
.risk-tag.safe{background:color-mix(in srgb,var(--safe) 14%,transparent);color:var(--safe);}
.risk-tag.caution{background:color-mix(in srgb,var(--cau) 14%,transparent);color:#a06400;}
.risk-tag.high{background:color-mix(in srgb,var(--hi) 14%,transparent);color:var(--hi);}
.risk-tag.na{background:color-mix(in srgb,var(--mut) 14%,transparent);color:var(--mut);}
.drug-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:0 0 8px;padding:8px 12px;background:color-mix(in srgb,var(--mut) 4%,var(--card));border-radius:10px;border:1px solid var(--line);align-items:center;}
.drug-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;}
.global-legend{margin:14px 2px 4px;padding:10px 14px;background:color-mix(in srgb,var(--g1) 4%,var(--card));border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--ink);}
.global-legend .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.global-legend .leg{display:inline-flex;align-items:center;gap:5px;}
.global-legend .leg .bar{display:inline-block;width:4px;height:14px;border-radius:2px;}
.global-legend .leg .pill{display:inline-block;width:10px;height:10px;border-radius:3px;}
.global-legend .ttl{font-weight:600;color:var(--mut);font-size:11px;letter-spacing:.04em;margin-right:6px;}
.drug .tier-tag{font-size:10.5px;font-weight:600;border-radius:6px;padding:1.5px 7px;margin-left:6px;letter-spacing:.02em;display:inline-block;vertical-align:middle;}
.drug .tier-tag.t-mild{background:color-mix(in srgb,var(--safe) 14%,transparent);color:var(--safe);}
.drug .tier-tag.t-severe{background:color-mix(in srgb,var(--hi) 14%,transparent);color:var(--hi);}
.drug .tier-tag.t-supp{background:color-mix(in srgb,var(--mut) 14%,transparent);color:var(--mut);}
.drug-group-h{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin:14px 0 6px;padding:0 17px;}
.drug-group-h.severe{color:var(--hi);}
.drug-group-h.mild{color:var(--safe);}
.emo{padding:0 17px 17px;}
.emo .box{background:color-mix(in srgb,var(--hi) 9%,var(--card));border:1px solid color-mix(in srgb,var(--hi) 30%,transparent);
border-radius:14px;padding:13px 15px;color:var(--hi);font-weight:600;font-size:13.5px;}
.section h3{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:34px 2px 12px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.ic{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--card);}
.ic.ban{border-left:4px solid var(--hi);}
.ic .t{font-weight:600;font-size:14.5px;margin-bottom:3px;}
.ic .k{font-size:12.5px;color:var(--mut);margin-bottom:5px;}
.ic .m{font-size:12.5px;}
.note{font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin:14px 0;background:var(--card);}
.note.warn{border-color:color-mix(in srgb,var(--cau) 40%,transparent);}
.foot{margin-top:40px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:16px;line-height:1.7;}
.dim-seg{margin:14px 2px 2px;}
.shd{font-size:13px;font-weight:600;color:var(--mut);margin:18px 2px 8px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
.shd-tag{font-size:11px;font-weight:500;color:var(--g1);background:color-mix(in srgb,var(--g1) 10%,transparent);border-radius:8px;padding:2px 8px;}
.ctile{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 14px;text-align:left;font:inherit;color:inherit;transition:.2s;display:flex;flex-direction:column;gap:6px;}
.ctile:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.08);border-color:var(--line2);}
.ctile .cnm{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.35;color:var(--ink);}
.ctile .csrc{font-size:11.5px;color:var(--mut);}
.ctile .csrc b{color:var(--g1);font-weight:500;}
.ctile{position:relative;}
.ctile.sev-high{border-left:4px solid var(--hi);}
.ctile.sev-med{border-left:4px solid var(--cau);}
.ctile.sev-low{border-left:3px solid color-mix(in srgb,var(--cau) 50%,transparent);}
.ctile .em-mark{color:var(--hi);font-size:11.5px;font-weight:600;}
.tile{position:relative;}
.tile.sev-high{border-left:4px solid var(--hi);}
.tile.sev-med{border-left:4px solid var(--cau);}
.tile.sev-low{border-left:3px solid color-mix(in srgb,var(--cau) 50%,transparent);}
.cz.sev-high{border-left:4px solid var(--hi);}
.cz.sev-med{border-left:4px solid var(--cau);}
.cz .em-tag.warn{color:var(--cau);}
.em-mark{color:var(--hi);font-weight:700;}
.em-tag{color:var(--hi);}
.csym.em-csym{border-left:4px solid var(--hi);position:relative;}
.cgrp-hd{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:0;margin:20px 2px 8px;padding-left:10px;border-left:3px solid transparent;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.cgrp.sev-high>.cgrp-hd{border-left-color:var(--hi);}
.cgrp.sev-med>.cgrp-hd{border-left-color:var(--cau);}
.cgrp-zh{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:0.02em;}
.cgrp-cnt{font-size:12px;font-weight:400;color:var(--mut);}
.pgh-zh{font-size:12px;color:var(--mut);margin-left:6px;}
.em-bar{display:none;}
.exams-block{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.exam-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-size:13px;line-height:1.55;}
.exam-row.must{background:color-mix(in srgb,var(--safe) 6%,var(--card));border-color:color-mix(in srgb,var(--safe) 30%,transparent);}
.exam-row.opt{background:color-mix(in srgb,var(--cau) 5%,var(--card));border-color:color-mix(in srgb,var(--cau) 25%,transparent);}
.exam-row.avoid{background:color-mix(in srgb,var(--hi) 5%,var(--card));border-color:color-mix(in srgb,var(--hi) 25%,transparent);}
.exam-lb{flex-shrink:0;font-weight:600;font-size:12.5px;min-width:62px;}
.exam-row.must .exam-lb{color:var(--safe);}
.exam-row.opt .exam-lb{color:#a06400;}
.exam-row.avoid .exam-lb{color:var(--hi);}
.exam-tx{flex:1;color:var(--ink);}
.combo-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.combo-card{padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--g1) 4%,var(--card));}
.combo-card.fired{border-color:color-mix(in srgb,var(--safe) 50%,transparent);background:color-mix(in srgb,var(--safe) 7%,var(--card));}
.combo-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.combo-tag{font-size:10.5px;font-weight:600;padding:1.5px 7px;border-radius:6px;background:color-mix(in srgb,var(--g2) 14%,transparent);color:var(--g2);letter-spacing:.04em;}
.combo-nm{font-size:14px;font-weight:600;color:var(--ink);}
.combo-ok{font-size:11.5px;color:var(--safe);font-weight:600;margin-left:auto;}
.combo-todo{font-size:11.5px;color:var(--mut);margin-left:auto;}
.combo-hint{font-size:12px;color:var(--mut);margin-bottom:8px;line-height:1.5;}
.combo-atoms{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;}
.combo-chip{font:inherit;font-size:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;transition:.15s;}
.combo-chip:hover{border-color:var(--g1);background:color-mix(in srgb,var(--g1) 6%,var(--card));}
.combo-chip.on{background:color-mix(in srgb,var(--safe) 14%,var(--card));border-color:var(--safe);color:var(--safe);font-weight:500;}
.combo-tgt{font-size:11.5px;color:var(--mut);margin-top:6px;}
.combo-tgt b{color:var(--g1);font-weight:600;}
.combo-actions{margin-top:10px;display:flex;justify-content:flex-end;}
.combo-lock-btn{font:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:10px;border:1px solid var(--g1);background:color-mix(in srgb,var(--g1) 8%,var(--card));color:var(--g1);cursor:pointer;transition:.15s;}
.combo-lock-btn:hover{background:var(--g1);color:#fff;}
.combo-card.locked{border:2px solid var(--g1);background:color-mix(in srgb,var(--g1) 6%,var(--card));}
.combo-card.clickable{transition:.18s;}
.combo-card.clickable:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.08);border-color:var(--g1);}
.combo-atoms-static{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;}
.combo-chip-static{display:inline-block;font-size:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:5px 10px;border-radius:999px;pointer-events:none;}
.combo-chip-static.on{background:color-mix(in srgb,var(--safe) 14%,var(--card));border-color:var(--safe);color:var(--safe);font-weight:500;}
.combo-arrow{color:var(--g1);font-size:12px;font-weight:500;margin-left:6px;}
.locked-banner{margin:12px 0;padding:11px 15px;background:color-mix(in srgb,var(--g1) 8%,var(--card));border:1px solid var(--g1);border-radius:12px;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.locked-banner b{color:var(--g1);font-weight:600;}
.unlock-btn{font:inherit;font-size:11.5px;padding:4px 10px;border-radius:8px;border:1px solid var(--mut);background:var(--card);color:var(--mut);cursor:pointer;margin-left:auto;}
.unlock-btn:hover{background:var(--mut);color:var(--card);}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px;}
.cgrp{margin:18px 2px 6px;}
.cgrp h4{font-size:12px;font-weight:600;color:var(--mut);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;}
.cd-hd{padding:6px 2px 4px;}
.cd-hd h2{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:2px 0 4px;}
.cd-meta{font-size:12.5px;color:var(--mut);margin-bottom:14px;}
.cd-meta .em-tag{color:var(--hi);font-weight:600;margin-right:6px;}
.cd-intro{font-size:14px;line-height:1.7;color:var(--ink);opacity:.88;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 17px;margin:10px 0;}
.cd-etio{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 17px 10px;margin:8px 0;}
.etio-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);align-items:flex-start;}
.etio-row:last-child{border-bottom:none;}
.etio-lb{flex:0 0 76px;font-size:12px;font-weight:600;color:var(--g2);padding-top:1px;letter-spacing:.02em;}
.etio-tx{flex:1;font-size:13.5px;line-height:1.65;color:var(--ink);opacity:.86;}
.etio-row.in-card{padding:7px 0;}
.etio-row.in-card .etio-lb{flex:0 0 64px;font-size:11.5px;}
.etio-row.in-card .etio-tx{font-size:13px;line-height:1.6;}
.cz .cetio{padding:0 17px 4px;background:color-mix(in srgb,var(--g1) 2%,transparent);border-top:1px solid var(--line);}

re":["降低应激、稳定环境","多猫家庭隔离患猫、分食盆","保持鼻眼清洁、可雾化","勿用人用抗病毒眼药(部分对猫有毒)"]},"eye:chl":{"intro":"衣原体/支原体感染结膜，多见幼猫与群养，经分泌物密切接触传播。","care":["足疗程口服，勿提前停(否则复发/耐药)","同窝/同居猫常需同治","隔离患猫、消毒共用物品","可感染人结膜，接触后洗手"]},"eye:nlo":{"intro":"鼻泪管阻塞致泪液无法正常引流到鼻腔，溢出眼眶形成持续溢泪/泪痕；短鼻品种结构性高发。","care":["每日用湿巾轻擦眼周泪痕、保持干燥","泪痕重时可用泪痕清洁液","合并感染时按医嘱滴抗生素眼药","若 NLD 冲洗后反复堵塞，考虑外科成形术"]},"eye:pra":{"intro":"渐进性视网膜萎缩，遗传性致进行性失明；无治愈方法，但猫嗅觉触觉补偿好，绝大多数可适应失明的生活。","care":["保持家具位置不变，让猫记住路径","夜灯/地灯帮助低视猫导航","地面铺防滑地毯防摔","避免改变生活环境(搬家/家具调整)","繁育猫需基因检测，阳性退出繁育"]},"uri:fhv":{"intro":"疱疹病毒性上呼吸道感染(俗称猫鼻支)，最常见的猫感冒病原；飞沫/分泌物/共用物品传播，潜伏后应激复发。","care":["隔离患猫、单独食盆猫砂","保暖、通风、减少应激","食欲差时加热湿粮增香、必要时促食欲","鼻塞可雾化/热敷；接种疫苗减轻发作"]},"uri:fcv":{"intro":"杯状病毒感染，常致口腔/舌溃疡和上呼吸道症状；高度接触传染，环境耐受力强。","care":["口腔痛时喂软糊状食物并镇痛","严格隔离消毒(普通消毒剂差，用含氯)","保证进食饮水、防脱水","群体重视疫苗"]},"uri:myco":{"intro":"支原体/衣原体的细菌性感染，幼猫与群养高发，密切接触传播。","care":["足疗程口服，症状消失后再用1–2周","隔离、同居猫评估同治","多西环素用水/湿食送服防食道损伤","改善通风、降低饲养密度"]},"uri:bact":{"intro":"病毒或慢性鼻炎基础上的继发细菌感染，鼻涕转脓性。","care":["按疗程用抗生素、勿擅自停","清理鼻分泌物、雾化","加强营养与休息","反复发作查根本病因(鼻腔/牙齿)"]},"cough:asthma":{"intro":"过敏性下气道炎症，接触尘螨、香水、烟、猫砂粉尘等过敏原诱发。","care":["改用无尘低敏猫砂、禁烟禁香薰/喷雾","家中除尘、用空气净化器","避免剧烈应激","备吸入急救药；长期吸入激素维持"]},"cough:pneu":{"intro":"细菌或支原体引起的肺部感染，可继发于异物吸入、病毒或免疫低下。","care":["按疗程足量用药","保证休息、保暖、营养","必要时雾化+拍背排痰","呼吸费力立即就医吸氧"]},"cough:card":{"intro":"心脏病(多为肥厚型心肌病)导致肺内积液，属急症。","care":["绝对静养、减少搬动与刺激","严格遵医嘱用利尿剂并监测","低钠饮食","定期复查心超、肾功能、电解质"]},"vomit:ren":{"intro":"慢性肾病使毒素蓄积刺激胃肠引起呕吐，多见老年猫，病程不可逆只能控制。","care":["肾处方粮、保证饮水(湿粮/流动水)","止吐+护胃+促食欲支持","定期复查肾指标/血压/电解质","避免肾毒性药(NSAID、氨基糖苷)"]},"vomit:panc":{"intro":"胰腺炎症，常病因不明，可由高脂饮食、应激诱发。","care":["发作期禁食别太久、尽早恢复进食","低脂易消化饮食","积极补液+止吐+镇痛","避免高脂食物与暴食"]},"vomit:hyper":{"intro":"甲状腺激素过高加速代谢、刺激胃肠，老年猫常见。","care":["规律用药、定期复查T4","高代谢需充足营养","监测体重/心率/血压","治疗后复查肾功能"]},"vomit:dka":{"intro":"糖尿病失控引发酮症酸中毒，致命急症。","care":["立即住院，切勿在家拖延","稳定后规律胰岛素+监测血糖","定时定量喂食","严防漏打/重复打胰岛素"]},"vomit:gi":{"intro":"饮食不当、毛球、换粮、轻度胃炎等导致，多为自限。","care":["短暂清淡饮食、少量多餐","定期梳毛/化毛膏防毛球","换粮循序渐进(7天过渡)","持续呕吐或带血立即就医"]},"vomit:feeding":{"intro":"猫在自然界吃东西要咀嚼撕咬，而干粮颗粒便于直接吞咽、加上吃太快/抢食，经常导致餐后立即吐出整颗粮——这并不是病，是吃法问题，多数靠改饲喂方式就能解决，不必吃药。","care":["把干粮换成湿粮/泡软干粮，颗粒小更易咀嚼","用慢食碗/慢食球或铺平大盘，让它分散去找","少量多餐（每日3–5顿），避免饿急了暴食","多猫家庭分餐分点，杜绝争食","长毛猫每日梳毛、每周化毛膏，吃化毛粮辅助","持续频繁、带血、伴精神差就医，排除真正的胃肠/系统病"]},"diarrhea:gia":{"intro":"贾第虫经被污染的水/粪口传播，幼猫群养高发。","care":["环境彻底清洁消毒、勤换猫砂","治疗期隔离、处理粪便戴手套","可益生菌+易消化饮食辅助","治疗后复查粪便确认清除"]},"diarrhea:tf":{"intro":"三毛滴虫经粪口传播，年轻群养猫高发，易复发。","care":["严格按14天足疗程、勿自行加量/加频(神经毒)","环境清洁干燥、降低密度","可加可溶性纤维/益生菌","走路不稳/抽搐立即停药就医"]},"diarrhea:coc":{"intro":"球虫经粪口/污染环境传播，幼猫断奶或换环境后高发。","care":["环境每日清洁、粪便及时清除","开水/蒸汽消毒(卵囊耐普通消毒剂)","隔离患猫、补液防脱水","同窝同治"]},"diarrhea:are":{"intro":"肠道菌群失衡相关的慢性腹泻，对特定抗生素反应良好。","care":["配合高消化率/水解蛋白饮食","可长期低剂量维持、按需调整","补充益生菌/益生元","避免频繁换粮"]},"diarrhea:ibd":{"intro":"免疫介导的慢性肠道炎症，病因复杂，需活检确诊。","care":["水解蛋白/新型蛋白处方粮","激素需缓慢减量、勿骤停","监测体重、血糖(长期激素)","定期复查、调整方案"]},"diarrhea:diet":{"intro":"换粮过快、食物过敏/不耐受、偷吃零食或异物等饮食原因引起的腹泻，多自限；新猫到家、换粮、加餐零食是高发场景。","care":["严格 7 日渐进换粮(1/4→1/2→3/4→全)","换粮期记录每餐内容，便于排查过敏原","禁止人食、突然加零食/加蛋黄等","可加益生菌过渡、保证饮水","试粮(水解/低敏)期间必须单一处方粮，勿掺杂"]},"diarrhea:astro":{"intro":"猫星状病毒(FAstV)感染，幼猫与群养高发，常致急性/亚急性水样腹泻，部分伴呕吐；无特效药，以支持为主；猫舍/收容所/新引种猫群常见。","care":["补液+电解质是核心；幼猫易脱水需早干预","新引种猫先单独隔离观察2周再合群","接触面、食盆、猫砂盆用过硫酸氢钾或含氯消毒","群养期间发病要全群粪便排查(可能合并其他原虫/病毒)","可加益生菌过渡；待便型恢复后再考虑换粮"]},"appetite:stim":{"intro":"食欲下降多是其他病的信号，需先查病因；猫长期不吃易脂肪肝。","care":["先查并治原发病，促食欲只是辅助","加热湿粮增香、安静环境喂食","严重不吃需鼻饲/食管管饲","记录每日进食量与体重"]},"urine:fic":{"intro":"应激相关的无菌性膀胱炎，与多猫冲突、环境改变、肥胖少动有关，易反复。","care":["增加饮水(湿粮、流动水)、增设猫砂盆(N+1)","减少应激、丰容、用费洛蒙","控制体重、鼓励运动","公猫警惕完全尿闭—急症"]},"urine:uti":{"intro":"细菌性尿路感染，多见于老年、糖尿病、CKD猫。","care":["按培养结果足疗程用药","多饮水、保持猫砂清洁","控制基础病(糖尿病/CKD)","复查尿液确认清除"]},"urine:pye":{"intro":"细菌上行至肾脏的感染，可损伤肾功能，属较重感染。","care":["足疗程(常4–6周)、勿提前停","多饮水、监测肾功能","控制基础病","发热精神差需就医"]},"urine:stone":{"intro":"尿结晶/结石，与饮食、尿pH、饮水不足有关。","care":["按结石类型选处方粮、严格喂食","大量增加饮水","定期复查尿液与影像","公猫结石易堵塞—警惕尿闭"]},"ckd:prot":{"intro":"肾小球受损致蛋白漏出，加速肾病进展。","care":["肾处方粮(限磷、适量优质蛋白)","保证饮水、避免脱水","定期复查UPC/血压/肾功","避免肾毒性药物"]},"ckd:htn":{"intro":"CKD常并发高血压，可致视网膜出血/失明、加重心肾损伤。","care":["每日规律降压药、定期测血压","低钠饮食","突然失明需急诊","监测肾功能/电解质"]},"ckd:ane":{"intro":"肾脏促红素分泌不足导致贫血，病程进展常见。","care":["EPO类需配合补铁","监测HCT与血压","营养支持、减少应激","注意黑便/出血(会加重贫血)"]},"ckd:nau":{"intro":"尿毒素蓄积刺激引起恶心呕吐、食欲差。","care":["止吐+护胃+促食欲","少量多餐、加热增香","保证饮水、必要时皮下补液","定期复查"]},"ckd:pkd":{"intro":"多囊肾(PKD)，常染色体显性遗传致肾内囊肿渐进扩大；波斯系品种38%携带；中老年发展为CKD；早期超声可筛查。","care":["波斯/喜马拉雅/英短引种必查 PKD1 基因","每年复查超声 + 生化","控制体重、避免肾毒性药","进入 CKD 期后按 CKD 各分支治疗","阳性绝对不繁育"]},"skin:flea":{"intro":"跳蚤叮咬及其唾液过敏(FAD)，环境中虫卵幼虫是主要来源。","care":["所有同居猫狗同时驱蚤","彻底清洁环境(吸尘、洗烫窝垫)","持续每月驱虫≥3个月断代","禁用狗用含氯菊酯产品(对猫致命)"]},"skin:mite":{"intro":"疥螨/耳螨/蠕形螨等寄生，接触传染(耳螨幼猫常见)。","care":["同居动物同治、环境清洁","耳螨先清理耳道再上药","勿与其他猫共用美容工具","按疗程复查刮片"]},"skin:fung":{"intro":"皮肤癣菌(猫癣)，人畜共患；接触患猫或孢子污染环境传播，免疫低/幼猫高发。","care":["隔离患猫、限制活动范围","环境反复消毒、清除脱落毛发(孢子顽固)","接触后洗手；家人长癣就医","口服+药浴并用，到2次培养阴性才停"]},"skin:allerg":{"intro":"特应性/食物/环境过敏导致，瘙痒-舔抓恶性循环。","care":["排查并回避过敏原(食物试验/环境)","防过度舔抓(伊丽莎白圈)","环境除螨除尘","必要时长期免疫调节，勿长期大剂量激素"]},"abscess:abs":{"intro":"多由打架咬伤，细菌(常含厌氧菌)在皮下繁殖成脓。","care":["脓肿成熟需切开引流+冲洗","保持伤口清洁、勿自行挤压","按疗程抗生素","绝育减少打架；户外猫风险高"]},"cardio:chf":{"intro":"心肌病等致心衰、肺/胸腔积液，属急症，不可治愈只能控制。","care":["绝对静养、避免应激与剧烈活动","严格按利尿剂，监测静息呼吸频率(>40偏高)","低钠饮食","定期复查心超/肾功能/电解质"]},"cardio:ate":{"intro":"心脏内血栓脱落堵塞后肢动脉(鞍栓)，剧痛、瘫痪，极凶险。","care":["立即就医镇痛+抗栓，勿热敷/按摩患肢","长期抗血小板预防复发","治疗基础心脏病","预后谨慎，与兽医充分沟通"]},"cardio:hcm":{"intro":"肥厚型心肌病伴流出道梗阻/心律失常，部分品种有遗传倾向。","care":["避免应激与剧烈运动","规律用药、定期复查心超","注意呼吸与活动耐量变化","种猫建议做心脏筛查"]},"dm:dm":{"intro":"胰岛素相对不足致高血糖，与肥胖、饮食、品种有关，早期规范治疗部分可缓解。","care":["定时定量喂食(高蛋白低碳水)、规律打针","家庭血糖监测、记录曲线","减重、增加运动","严防低血糖(发抖/抽搐立即喂糖并就医)"]},"dm:dka":{"intro":"糖尿病失控的致命并发症，常由感染/漏打诱发。","care":["立即住院抢救，勿在家处理","稳定后规律胰岛素+监测","治疗诱因(感染等)","定期复查"]},"hyper:hyper":{"intro":"甲状腺良性增生致激素过多，老年猫常见；可药物/碘131/手术治疗。","care":["规律服药、定期复查T4与肾功能","保证营养(高代谢消耗大)","监测体重/心率/血压","碘131可根治，条件允许可考虑"]},"pain:oackd":{"intro":"老年退行性关节炎，合并肾病时不能用消炎止痛药。","care":["首选单抗镇痛(Solensia)、加巴喷丁","家居改造：低边猫砂盆、台阶、防滑、保暖","控制体重、适度活动","定期复查肾功能"]},"pain:oa":{"intro":"关节软骨退化致慢性疼痛，肥胖、年龄、既往损伤是诱因。","care":["低剂量NSAID须充分饮水、监测肾","减重、关节保健品(omega-3/软骨素)","家居改造便于活动","避免肥胖与过度跳跃硬着陆"]},"pain:acute":{"intro":"外伤或手术造成的急性疼痛。","care":["按医嘱镇痛、限制活动休息","伤口清洁防舔(伊丽莎白圈)","观察食欲/排泄/精神","勿自行用人用止痛药(致命)"]},"pain:hd":{"intro":"髋关节发育不良，遗传性骨科病；股骨头与髋臼匹配不良→慢性磨损→骨关节炎；缅因、布偶、波斯高发。","care":["严格控制体重(每超 0.5kg 关节负重↑数倍)","低边猫砂盆 + 坡道/台阶/防滑垫","避免大跳跃硬着陆，鼓励温和活动","定期复查 X 光评估进展","严重病例评估 FHO 或全髋置换"]},"pain:pl":{"intro":"髌骨从滑车沟内/外侧脱出，遗传性多见，缅因/英短/阿比西尼亚高发；表现为间歇性踢腿/抖腿、跳跃异常。","care":["I-II 级保守治疗：减重 + 家居改造","避免反复跳跃硬着陆","严重(III-IV)或反复发作需手术","术后严格限制活动 6–8 周","可与髋关节发育不良并存，需一并评估"]},"pain:sfo":{"intro":"苏格兰折耳的标志性遗传病，与折耳基因(TRPV4 c.1024G>T)相连，所有折耳猫都不同程度患病；终身进行性多关节骨关节炎，严重影响生活质量。许多动物福利组织反对该品种繁育。","care":["终身镇痛管理(Solensia+NSAID+加巴喷丁联合)","严格减重，每多 100g 都更痛","低边猫砂盆、防滑保暖、不能跳高","不要繁育(折耳×折耳=100%重症)","观察生活质量，必要时安乐评估"]},"neuro:epi":{"intro":"反复发作的脑神经异常放电，可原发或继发(中毒/肝病/脑病)。","care":["规律服药勿漏勿骤停、定期监测","发作时移开危险物、勿塞嘴、记录时长","避免诱因(应激/缺觉/漏药)","持续>5分钟立即就医"]},"neuro:anx":{"intro":"对陌生环境/出行的应激反应，并非疾病。","care":["提前在家适应航空箱、垫主人气味","出行前按需镇静、避免空腹过久","保持安静、覆盖航空箱减少视觉刺激","回家后给安静空间恢复"]},"neuro:beh":{"intro":"长期焦虑/territorial标记/冲突相关行为，常与多猫资源竞争有关。","care":["资源充足分散(食/水/猫砂/休息位 N+1)","费洛蒙、丰容、规律互动","标记处用酶清洁剂(防再标记)","药物数周起效，配合行为训练、勿骤停"]},"neuro:ch":{"intro":"小脑发育不全(CH)，由母猫妊娠期或新生期 FPV 感染破坏小脑发育所致；出生即症状(意向性震颤、共济失调、宽基步态)，但非进行性，多数可适应生活。完全可通过母猫孕前接种 FPV 预防。","care":["低边食盆水盆，铺地毯防滑","限制高处活动，楼梯加护栏","母猫孕前完成 FPV 灭活苗接种","母猫孕期不可用 FPV 活苗","受影响幼猫可正常生活，预期寿命正常"]},"sepsis:abs":{"intro":"局部化脓性感染(多为咬伤脓肿)，全身状况尚可。","care":["引流+清创+抗生素","保持伤口清洁、戴圈防舔","观察是否发热/扩散","绝育减少打架"]},"sepsis:sep":{"intro":"感染扩散入血的全身重症，死亡风险高。","care":["立即住院，静脉抗生素+液体复苏","密切监护生命体征/血乳酸","积极支持(保暖/营养/镇痛)","尽快依培养调整用药"]},"sepsis:mdr":{"intro":"多重耐药菌感染，常见于院内或反复用药后，治疗困难。","care":["严格依药敏用药、足疗程","接触隔离、勤手卫生防院内传播","保留药仅必要时用","平时避免滥用抗生素"]},"fip:wet":{"intro":"猫冠状病毒在体内变异引发的免疫介导性炎症，多见断奶后幼猫；应激/高密度增加风险。曾被视为绝症，现可治。","care":["全程84天不可中断、每周称重调量","用药期监测CBC/生化/AGP","降低应激、营养支持、隔离观察","停药后观察12周防复发"]},"fip:dry":{"intro":"FIP的非渗出型，在器官形成肉芽肿，诊断较难。","care":["足疗程治疗、定期复查","营养与支持治疗","降低应激","与兽医密切随访"]},"fip:neu":{"intro":"FIP累及神经/眼，需更高剂量药物穿过血脑屏障。","care":["按高剂量足疗程、勿擅自减量","监测神经症状变化","营养与护理支持","随访影像/眼科评估"]},"parasite:prev":{"intro":"日常预防体内外寄生虫，保护猫与家人(部分人畜共患)。","care":["按月规律使用、勿漏","多宠家庭同步驱虫","禁用狗用含氯菊酯产品","滴剂后2小时勿洗澡/舔舐"]},"parasite:tape":{"intro":"绦虫多由误食带蚤或猎物感染，可见肛门米粒样节片。","care":["驱绦同时必须灭蚤(根本来源)","控制户外捕猎","环境清洁","定期粪检"]},"abort:fpv":{"intro":"猫瘟病毒可致孕猫流产/死胎，高度传染、环境耐受强。","care":["孕前完成免疫(用灭活苗)、引种检疫","爆发时全群隔离、含氯/过硫酸氢钾消毒","病猫支持治疗、防继发","康复猫排毒数周，需隔离"]},"abort:fhv":{"intro":"疱疹病毒可致妊娠中期(5–6周)流产，多继发于母猫上呼吸道感染。","care":["孕前接种、控制母猫呼吸道病","降低猫舍密度与应激","隔离患猫","保暖通风"]},"abort:retro":{"intro":"FeLV/FIV可致流产/吸收/不孕，经唾液/血/母婴传播。","care":["引种必检、阳性退出繁育或隔离","不让阳性猫繁育","FeLV可疫苗预防","定期筛查全群"]},"abort:chl":{"intro":"衣原体/支原体可致繁殖障碍，常伴结膜炎/上呼吸道，接触传播。","care":["足疗程治疗(孕期用药需兽医权衡)","隔离、同群评估","改善通风与密度","注意可感染人结膜"]},"abort:metr":{"intro":"子宫细菌感染/蓄脓，发情后高发，可危及生命。","care":["闭合性/重症首选绝育手术","非种用母猫建议绝育预防","按药敏抗生素","脓性分泌+精神差立即就医"]},"abort:prog":{"intro":"黄体功能不足致孕酮过低，胚胎无法维持。","care":["须兽医监测孕酮精确补充","用药/停药时机严格(过量致畸/难产)","非常规自行用药","查找并排除其他流产病因"]},"fading:hhh":{"intro":"新生猫体温调节与血糖储备差，受凉或吃奶不足会迅速恶化，是新生儿死亡主因。","care":["保温(育儿箱30–32℃)、缓慢复温","少量多次喂奶、每日称重监测","低体温先复温再喂(勿喂冷奶)","环境安静、母猫照护或人工接管"]},"fading:fni":{"intro":"母B型×仔A型时，初乳抗体破坏幼猫红细胞，出生24–48h内发病。","care":["种猫全部血型鉴定、避免危险配对","高危幼猫48h内禁哺该母猫、人工喂养","48h后可回归母猫","好发布偶/英短/德文卷毛等"]},"fading:neosep":{"intro":"新生猫经脐带/产道/环境感染细菌入血，进展极快。","care":["脐带消毒(碘伏)、产房清洁","保温补液+β-内酰胺抗生素","确保初乳摄入(被动免疫)","避免氨基糖苷/氟喹诺酮/四环素"]},"fading:asp":{"intro":"奶呛入气管/肺，多因人工喂养手法不当或腭裂、虚弱吞咽差。","care":["正确喂养：俯卧、奶速慢、勿仰头灌","呛奶后拍背、必要时吸氧","排查腭裂等先天缺陷","氧疗+抗生素，严重需管饲"]},"fading:cong":{"intro":"先天发育异常(腭裂、心脏畸形等)或低出生体重。","care":["对症支持、必要时手术(如腭裂)","保温营养、密切监测","评估生活质量","遗传相关应调整配种计划"]},"ear:mite":{"intro":"耳螨经接触传染，幼猫与多猫家庭高发，剧痒、黑色耳垢。","care":["同居动物同治","先清理耳道再上药、按疗程","勿与其他猫共用美容工具","复查确认清除"]},"ear:exoto":{"intro":"细菌或马拉色菌引起的外耳道感染，常继发于耳螨、潮湿、过敏。","care":["先做细胞学定性再选药","清理+滴耳药、按疗程","保持耳道干燥","反复发作查过敏/螨等根本原因"]},"ear:vest":{"intro":"内耳/前庭受累(感染、息肉等)致歪头失衡，需就医。","care":["尽快就医、影像评估","防摔伤、限制高处活动","按医嘱抗感染/手术","勿自行掏耳"]},"mouth:perio":{"intro":"牙菌斑、牙结石致牙周炎/牙吸收，口臭、牙龈红、进食痛。","care":["洁牙/拔牙是根治，日常刷牙/洁齿","软食过渡、镇痛","抗生素仅围手术期短期","定期口腔检查"]},"mouth:stoma":{"intro":"免疫异常引起的慢性龈口炎，口腔后部弥漫剧痛，病因复杂。","care":["全口/后磨牙拔除最有效","免疫调节/激素或环孢素维持","流食、强力镇痛","定期复查、耐心长期管理"]},"mouth:fcv":{"intro":"杯状病毒可致口腔溃疡，高度接触传染。","care":["软糊食物+镇痛","隔离消毒(含氯)","保证进食饮水","群体重视疫苗"]},"mouth:renu":{"intro":"慢性肾病尿毒素致口腔溃疡，见于老年肾病猫。","care":["以治疗肾病为本(见喝多尿多章)","口腔护理+护胃止吐","软食、保证饮水","定期复查肾指标"]},"lethargy:infect":{"intro":"发热性感染/炎症会让猫精神差、躲藏，需查因。","care":["先就医测体温、血常规","保暖、补水、安静休息","勿自行用药掩盖病情","明确病原后针对治疗"]},"lethargy:anemia":{"intro":"贫血(失血/溶血/肾性等)致乏力、黏膜苍白。","care":["尽快就医查血常规与病因","减少应激与活动","注意黑便/出血","按病因治疗，重症需输血"]},"lethargy:organ":{"intro":"肾/肝/胰/糖尿等内脏代谢病常以精神差、消瘦起病。","care":["查生化定位、对症处理(见对应章)","保证饮水营养","定期复查","避免肾毒/肝毒药物"]},"lethargy:pain":{"intro":"关节、口腔、腹腔等隐痛会表现为躲藏、不爱动。","care":["就医定位疼痛来源","镇痛须兽医(勿用人药)","家居改造便于活动","观察食欲与排泄"]},"lethargy:emergcrit":{"intro":"中毒、低血糖、休克、内出血等危重情况，刻不容缓。","care":["立即送医，记录可疑接触物","保暖、勿喂食喂水(防误吸)","勿自行催吐/喂药","携带可疑毒物包装就医"]},"jaundice:hepa":{"intro":"肝胆疾病(胆管炎、肝脂沉积等)致胆红素升高、发黄；长期厌食可诱发肝脂沉积。","care":["强制/管饲营养是肝脂沉积关键","补液、护肝、必要时抗生素","少量多餐高蛋白(遵医嘱)","定期复查肝指标"]},"jaundice:hemo":{"intro":"红细胞被破坏(洋葱/大蒜/对乙酰氨基酚中毒、免疫性等)致溶血性黄疸。","care":["立即停止接触可疑毒物并就医","免疫性需激素；重症输血","减少应激与活动","严禁洋葱/大蒜/人用药"]},"jaundice:fipj":{"intro":"FIP累及肝可致黄疸，多见幼猫。","care":["按FIP方案GS-441524治疗(见FIP章)","营养支持、降低应激","足疗程不可中断","定期复查"]},"eye:uveitis":{"intro":"葡萄膜炎是猫眼科最常见的内部炎症，必须查找全身原发病(FIP/弓形虫/FeLV/FIV/淋巴瘤/外伤等)。","care":["按时滴眼药；激素+散瞳并用","查并治原发病","严密监测眼压变化","防继发青光眼/白内障"]},"eye:glauc":{"intro":"眼内压急剧升高的眼科急症，>6小时不降压可永久失明。","care":["发现立即送眼科","每日按时滴降压药","勿压迫眼球","失明且痛的眼可考虑摘除"]},"eye:seq":{"intro":"猫特有的角膜中央黑色坏死片，与 FHV-1 慢性感染相关；可手术切除或保守观察。","care":["专科眼科评估手术","保守期保护防摩擦","控制 FHV 复发(L-赖氨酸+减应激)","定期复查腐片进展"]},"cough:plef":{"intro":"胸腔内液体积聚致呼吸困难；猫多见脓胸(感染)、乳糜胸(特发性最多)、漏出液(心衰/低蛋白/FIP)。","care":["紧急时穿刺减压","按液体类型选治疗","脓胸需留置胸管","乳糜胸限脂"]},"cough:hw":{"intro":"猫心丝虫病在亚热带高发但被严重低估；表现以呼吸道炎症(HARD)为主，非心脏症状。","care":["居住蚊媒区必须月度心丝虫预防","禁用伊维菌素杀虫(死虫体释放过敏致死)","急性期氧疗+激素控制","成虫负荷大时考虑手术取虫"]},"cardio:rcm":{"intro":"限制型心肌病：心肌僵硬不能舒张，预后差于 HCM。","care":["规律利尿剂+抗血小板","严格静养、防应激","低钠饮食","定期复查心超"]},"cardio:dcm":{"intro":"扩张型心肌病在猫多由牛磺酸缺    // Step 4: 检查结果指标(m=vet clues)

   }
 }
 var anySel=selKeys().some(function(k){var o=GBYKEY[k];return o&&(o.m===ST.mode||o.m==='both');});
 html+='<div class="step"><span class="n">'+(st++)+'</span><span class="t">可能的疾病</span><span class="sub">'+(anySel?'综合所有线索 · 按可能性排序':'勾选线索后显示')+'</span></div>';
 if(!anySel){ html+='<div class="placeholder">请先勾选你观察到的线索（可跨症状添加），我会综合估算各疾病的可能性。</div>'; }
 else {

       if(ann.care&&ann.care.length)h+='<div class="care"><div class="ct">🩺 护理与注意事项</div><ul>'+ann.care.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
     }
     h+='</div>';return h;
   }).join('')+'</div>';
 }
