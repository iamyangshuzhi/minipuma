<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minipuma猫咪治愈参考</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#fbfbfd;--card:#fff;--ink:#1d1d1f;--mut:#86868b;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.12);
--g1:#4285F4;--g2:#9B72CB;--g3:#D96570;--safe:#34a853;--cau:#f5a623;--hi:#ea4335;--radius:22px;}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#98989d;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;line-height:1.55;}
.app{max-width:1000px;margin:0 auto;padding:0 20px 120px;}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);
-webkit-backdrop-filter:saturate(180%) blur(20px);padding:14px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:10px;}
.brand .logo{font-size:22px;}
.brand h1{font-size:19px;font-weight:600;letter-spacing:-.02em;margin:0;}
.brand .tag{font-size:12px;color:var(--mut);margin-left:auto;}
.hero{padding:30px 4px 14px;}
.hero h2{font-size:34px;font-weight:600;letter-spacing:-.03em;margin:0 0 6px;
background:linear-gradient(110deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{color:var(--mut);font-size:15px;margin:0;max-width:640px;}
.search{margin:18px 4px 8px;position:relative;}
.search input{width:100%;border:1px solid var(--line2);background:var(--card);color:var(--ink);
border-radius:999px;padding:13px 18px 13px 44px;font-size:15px;outline:none;transition:.2s;}
.search input:focus{border-color:var(--g1);box-shadow:0 0 0 4px color-mix(in srgb,var(--g1) 16%,transparent);}
.search .si{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:16px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px;}
.tile{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);
padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
transition:transform .2s cubic-bezier(.4,0,.2,1),box-shadow .2s,border-color .2s;font:inherit;color:inherit;}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.10);border-color:var(--line2);}
.tile .em{font-size:30px;line-height:1;}
.tile .nm{font-size:14px;font-weight:500;letter-spacing:-.01em;}
.tile .em.warn{filter:drop-shadow(0 0 0 transparent);}
.fade{animation:fade .35s cubic-bezier(.4,0,.2,1);}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--g1);font:inherit;
font-size:15px;cursor:pointer;padding:14px 0 6px;}
.dh{padding:6px 2px 4px;}
.dh h2{font-size:27px;font-weight:600;letter-spacing:-.02em;margin:2px 0 4px;}
.emerg{background:color-mix(in srgb,var(--hi) 12%,var(--card));border:1px solid color-mix(in srgb,var(--hi) 35%,transparent);
color:var(--hi);border-radius:16px;padding:11px 15px;font-size:14px;font-weight:500;margin:10px 0;}
.step{margin:22px 2px 8px;display:flex;align-items:center;gap:10px;}
.step .n{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;
font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.step .t{font-size:15px;font-weight:600;letter-spacing:-.01em;}
.step .sub{font-size:12.5px;color:var(--mut);margin-left:auto;}
.seg{display:inline-flex;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:999px;padding:4px;gap:2px;margin:2px 0;}
.seg button{border:none;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--mut);
padding:8px 18px;border-radius:999px;cursor:pointer;transition:.22s;}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);}
.clues{display:flex;flex-wrap:wrap;gap:9px;margin:6px 2px 2px;}
.chip{cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink);font:inherit;
font-size:13.5px;border-radius:999px;padding:8px 15px;transition:.18s;user-select:none;}
.chip:hover{border-color:var(--mut);}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff;
box-shadow:0 4px 14px color-mix(in srgb,var(--g2) 35%,transparent);}
.chip .vt{font-size:11px;opacity:.6;margin-left:5px;}
.hint{font-size:12.5px;color:var(--mut);margin:8px 2px 0;}
.causes{display:flex;flex-direction:column;gap:11px;margin-top:6px;}
.cz{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);overflow:hidden;transition:.2s;}
.cz:hover{border-color:var(--line2);}
.cz.open{border-color:var(--g1);box-shadow:0 10px 30px rgba(0,0,0,.08);}
.cz .head{display:flex;align-items:center;gap:12px;padding:15px 17px;cursor:pointer;}
.cz .rank{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;width:18px;flex:0 0 auto;}
.cz .nmwrap{flex:1;min-width:0;}
.cz .nm{font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
.cz .bar{height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);margin-top:7px;overflow:hidden;}
.cz .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--g1),var(--g2));width:0;transition:width .5s cubic-bezier(.4,0,.2,1);}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 11px;white-space:nowrap;flex:0 0 auto;}
.pill.dx{background:color-mix(in srgb,var(--safe) 16%,transparent);color:var(--safe);}
.pill.hx{background:color-mix(in srgb,var(--cau) 18%,transparent);color:#b9770e;}
.pill.em{background:color-mix(in srgb,var(--hi) 14%,transparent);color:var(--hi);}
.cz .chev{color:var(--mut);transition:transform .25s;font-size:13px;}
.cz.open .chev{transform:rotate(90deg);}
.drugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:0 17px 17px;}
.drug{border:1px solid var(--line);border-radius:15px;padding:12px 13px;background:color-mix(in srgb,var(--ink) 2.5%,var(--card));}
.drug .dt{display:flex;align-items:baseline;gap:8px;}
.drug .dn{font-size:14px;font-weight:600;letter-spacing:-.01em;}
.drug .de{font-size:11px;color:var(--mut);font-style:italic;}
.drug .cure{margin-left:auto;font-size:11.5px;font-weight:700;color:#2a5db0;background:color-mix(in srgb,var(--g1) 14%,transparent);
border-radius:999px;padding:2px 9px;white-space:nowrap;}
.drug .dm{font-size:12px;color:var(--ink);margin-top:6px;opacity:.85;}
.drug .dnt{font-size:11.5px;color:var(--mut);margin-top:5px;}
.drug.safe{border-left:4px solid var(--safe);}
.drug.caution{border-left:4px solid var(--cau);}
.drug.high{border-left:4px solid var(--hi);}
.drug.na{border-left:4px solid var(--mut);}
.emo{padding:0 17px 17px;}
.emo .box{background:color-mix(in srgb,var(--hi) 9%,var(--card));border:1px solid color-mix(in srgb,var(--hi) 30%,transparent);
border-radius:14px;padding:13px 15px;color:var(--hi);font-weight:600;font-size:13.5px;}
.section h3{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:34px 2px 12px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.ic{border:1px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--card);}
.ic.ban{border-left:4px solid var(--hi);}
.ic .t{font-weight:600;font-size:14.5px;margin-bottom:3px;}
.ic .k{font-size:12.5px;color:var(--mut);margin-bottom:5px;}
.ic .m{font-size:12.5px;}
.note{font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin:14px 0;background:var(--card);}
.note.warn{border-color:color-mix(in srgb,var(--cau) 40%,transparent);}
.foot{margin-top:40px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:16px;line-height:1.7;}
.dim-seg{margin:14px 2px 2px;}
.shd{font-size:13px;font-weight:600;color:var(--mut);margin:18px 2px 8px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
.shd-tag{font-size:11px;font-weight:500;color:var(--g1);background:color-mix(in srgb,var(--g1) 10%,transparent);border-radius:8px;padding:2px 8px;}
.ctile{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 14px;text-align:left;font:inherit;color:inherit;transition:.2s;display:flex;flex-direction:column;gap:6px;}
.ctile:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.08);border-color:var(--line2);}
.ctile .cnm{font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.35;color:var(--ink);}
.ctile .csrc{font-size:11.5px;color:var(--mut);}
.ctile .csrc b{color:var(--g1);font-weight:500;}
.ctile.em{border-left:3px solid var(--hi);}
.ctile .em-mark{color:var(--hi);font-size:11.5px;font-weight:600;}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px;}
.cgrp{margin:18px 2px 6px;}
.cgrp h4{font-size:12px;font-weight:600;color:var(--mut);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;}
.cd-hd{padding:6px 2px 4px;}
.cd-hd h2{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:2px 0 4px;}
.cd-meta{font-size:12.5px;color:var(--mut);margin-bottom:14px;}
.cd-meta .em-tag{color:var(--hi);font-weight:600;margin-right:6px;}
.cd-intro{font-size:14px;line-height:1.7;color:var(--ink);opacity:.88;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 17px;margin:10px 0;}
.cd-etio{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 17px 10px;margin:8px 0;}
.etio-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);align-items:flex-start;}
.etio-row:last-child{border-bottom:none;}
.etio-lb{flex:0 0 76px;font-size:12px;font-weight:600;color:var(--g2);padding-top:1px;letter-spacing:.02em;}
.etio-tx{flex:1;font-size:13.5px;line-height:1.65;color:var(--ink);opacity:.86;}
.etio-row.in-card{padding:7px 0;}
.etio-row.in-card .etio-lb{flex:0 0 64px;font-size:11.5px;}
.etio-row.in-card .etio-tx{font-size:13px;line-height:1.6;}
.cz .cetio{padding:0 17px 4px;background:color-mix(in srgb,var(--g1) 2%,transparent);border-top:1px solid var(--line);}
.cd-sec h3{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:20px 2px 8px;display:flex;align-items:center;gap:8px;}
.cd-syms{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;}
.csym{cursor:pointer;font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 13px;text-align:left;display:flex;align-items:center;gap:10px;transition:.2s;}
.csym:hover{border-color:var(--g1);transform:translateY(-1px);}
.csym .em{font-size:22px;}
.csym .body{flex:1;min-width:0;}
.csym .nm{font-size:13.5px;font-weight:600;line-height:1.3;}
.csym .tag{font-size:11px;color:var(--mut);margin-top:2px;}
.csym.home .tag{color:var(--g1);font-weight:500;}
.csym.sib{border-color:color-mix(in srgb,var(--g2) 30%,var(--line));background:color-mix(in srgb,var(--g2) 4%,var(--card));}
.csym.sib .tag{color:var(--g2);font-weight:500;}
.csym.sib:hover{border-color:var(--g2);}
.csym.ment{opacity:.85;}
.csym.ment .tag{color:var(--mut);}
.csym.ment:hover{transform:none;border-color:var(--line);}
.cd-clue{font-size:12.5px;color:var(--ink);opacity:.78;border-left:2px solid var(--line2);padding:2px 0 2px 10px;margin:3px 0;}
.cd-tx{display:inline-flex;align-items:center;gap:6px;font:inherit;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;}
.cd-tx:hover{filter:brightness(1.05);}
.exams{display:flex;flex-wrap:wrap;gap:8px;margin:4px 2px 2px;}
.exam{font-size:13px;color:var(--ink);background:color-mix(in srgb,var(--g1) 8%,var(--card));border:1px solid var(--line);border-radius:11px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;line-height:1.4;}
.exam .prio{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;line-height:1.5;flex:0 0 auto;letter-spacing:.02em;}
.exam.ex-must{background:color-mix(in srgb,var(--hi) 7%,var(--card));border-color:color-mix(in srgb,var(--hi) 28%,var(--line));}
.exam.ex-must .prio{background:color-mix(in srgb,var(--hi) 18%,transparent);color:var(--hi);}
.exam.ex-rec{background:color-mix(in srgb,var(--g1) 8%,var(--card));border-color:var(--line);}
.exam.ex-rec .prio{background:color-mix(in srgb,var(--g1) 20%,transparent);color:#2a5db0;}
.exam.ex-opt{background:color-mix(in srgb,var(--ink) 3%,var(--card));border-color:var(--line);opacity:.78;}
.exam.ex-opt .prio{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--mut);}
.placeholder{border:1px dashed var(--line2);border-radius:var(--radius);padding:28px 22px;text-align:center;color:var(--mut);font-size:14px;}
.ptag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;white-space:nowrap;flex:0 0 auto;}
.cz .em-tag{margin-right:6px;}
.cintro{font-size:13px;color:var(--ink);opacity:.8;padding:4px 17px 0;line-height:1.65;}
.crel{font-size:11.5px;color:var(--mut);padding:7px 17px 2px;}
.crel b{color:var(--ink);font-weight:600;}
.care{padding:8px 17px 16px;}
.care .ct{font-size:13px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:6px;}
.care ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
.care li{font-size:12.5px;color:var(--ink);opacity:.85;padding-left:18px;position:relative;line-height:1.55;}
.care li::before{content:"";position:absolute;left:5px;top:8px;width:5px;height:5px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));}
.chip.add{border-style:dashed;border-color:var(--g1);color:var(--g1);font-weight:600;}
.chip.locked{opacity:.4;cursor:not-allowed;border-style:dashed;}
.flash{margin:10px 2px;padding:11px 14px;border-radius:14px;background:color-mix(in srgb,var(--cau) 13%,var(--card));border:1px solid color-mix(in srgb,var(--cau) 40%,transparent);color:#a66400;font-size:13px;line-height:1.55;animation:flashIn .3s ease;}
@keyframes flashIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.step .sub.cap{color:var(--hi);font-weight:600;}
.picker{border:1px solid var(--line2);border-radius:16px;padding:13px 14px;margin:10px 2px;background:color-mix(in srgb,var(--g1) 3%,var(--card));}
.psearch{width:100%;border:1px solid var(--line2);border-radius:999px;padding:10px 15px;font-size:14px;outline:none;background:var(--card);color:var(--ink);margin-bottom:11px;}
.psearch:focus{border-color:var(--g1);box-shadow:0 0 0 4px color-mix(in srgb,var(--g1) 14%,transparent);}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
.cat{font-size:12.5px;border:1px solid var(--line2);border-radius:999px;padding:6px 13px;background:var(--card);color:var(--ink);cursor:pointer;transition:.15s;}
.cat.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff;}
.clueorigin{font-size:10px;opacity:.7;margin-left:5px;}
.added{display:flex;flex-wrap:wrap;gap:8px;margin:11px 2px 0;}
.added .lbl{font-size:12.5px;color:var(--mut);align-self:center;}
.systag{font-size:10.5px;color:var(--mut);font-weight:400;margin-left:8px;border:1px solid var(--line);border-radius:7px;padding:1px 7px;vertical-align:middle;}
.pgrp{margin:4px 0 6px;}
.pgh{font-size:12px;color:var(--mut);margin:8px 0 5px;font-weight:600;}
.gate{min-height:62vh;display:flex;align-items:center;justify-content:center;padding:30px 10px;}
.gcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 28px;text-align:center;box-shadow:0 12px 44px rgba(0,0,0,.07);}
.gcard.wide{max-width:680px;text-align:left;}
.glogo{font-size:40px;}
.gcard h2{font-size:22px;font-weight:600;margin:8px 0 2px;}
.gby{color:var(--g2);font-size:13px;margin:0 0 6px;font-weight:500;}
.gsub{color:var(--mut);font-size:13px;margin:0 0 16px;}
.ginput{width:100%;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;background:var(--card);color:var(--ink);margin-bottom:10px;}
.ginput:focus{border-color:var(--g1);box-shadow:0 0 0 4px color-mix(in srgb,var(--g1) 14%,transparent);}
.ginput.sm{width:auto;flex:1;margin-bottom:0;}
.gbtn{width:100%;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));cursor:pointer;}
.gbtn.sm{width:auto;padding:10px 16px;}
.glink{margin-top:14px;color:var(--g1);font-size:13px;cursor:pointer;display:inline-block;}
.gerr{color:var(--hi);font-size:13px;margin-bottom:8px;}
.gok{color:var(--safe);font-size:13px;margin-bottom:8px;}
.arow{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap;}
.atab{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0;}
.atab th,.atab td{border:1px solid var(--line);padding:7px 9px;text-align:left;}
.atab th{background:var(--bg);font-weight:600;}
.mini{font-size:12px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:3px 8px;cursor:pointer;color:var(--ink);margin:1px;}
.mini.del{color:var(--hi);border-color:color-mix(in srgb,var(--hi) 50%,transparent);}
.ok{color:var(--safe);font-weight:600;}.off{color:var(--mut);}
.gnote{font-size:11.5px;color:var(--mut);margin-top:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:10px;}
.intro{text-align:left;margin:18px 0 16px;border-top:1px solid var(--line);padding-top:16px;}
.iblurb{font-size:14px;color:var(--ink);margin:0 0 14px;line-height:1.65;}
.igrp{margin:12px 0;}
.ihead{font-size:11.5px;font-weight:700;color:var(--g2);letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase;}
.ilist{margin:0;padding-left:22px;line-height:1.65;font-size:13px;color:var(--ink);opacity:.88;}
.ilist li{margin:3px 0;padding-left:2px;}
/* ===== 触控反馈（所有设备） ===== */
.tile,.chip,.gbtn,.mini,.cat,.cz .head,.seg button{touch-action:manipulation;}
.tile:active{transform:scale(.97);}
.chip:active{transform:scale(.96);}
.gbtn:active{transform:scale(.98);}
.cz .head:active{background:color-mix(in srgb,var(--ink) 3%,transparent);}
@supports(padding:max(0px)){.app{padding-bottom:max(120px,env(safe-area-inset-bottom));}.topbar{padding-top:max(14px,env(safe-area-inset-top));}}
/* ===== 移动端（≤640px） ===== */
@media (max-width:640px){
 body{-webkit-text-size-adjust:100%;}
 .app{padding:0 14px 110px;}
 .topbar{padding:10px 0 8px;}
 .brand h1{font-size:17px;}
 .brand .tag{font-size:11px;display:none;}
 .hero{padding:20px 2px 8px;}
 .hero h2{font-size:26px;letter-spacing:-.02em;}
 .hero p{font-size:14px;}
 .search input{padding:13px 16px 13px 42px;font-size:16px;}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
 .tile{padding:18px 10px;border-radius:18px;gap:8px;}
 .tile .em{font-size:28px;}

症酸中毒，致命急症。","care":["立即住院，切勿在家拖延","稳定后规律胰岛素+监测血糖","定时定量喂食","严防漏打/重复打胰岛素"]},"vomit:gi":{"intro":"饮食不当、毛球、换粮、轻度胃炎等导致，多为自限。","care":["短暂清淡饮食、少量多餐","定期梳毛/化毛膏防毛球","换粮循序渐进(7天过渡)","持续呕吐或带血立即就医"]},"vomit:feeding":{"intro":"猫在自然界吃东西要咀嚼撕咬，而干粮颗粒便于直接吞咽、加上吃太快/抢食，经常导致餐后立即吐出整颗粮——这并不是病，是吃法问题，多数靠改饲喂方式就能解决，不必吃药。","care":["把干粮换成湿粮/泡软干粮，颗粒小更易咀嚼","用慢食碗/慢食球或铺平大盘，让它分散去找","少量多餐（每日3–5顿），避免饿急了暴食","多猫家庭分餐分点，杜绝争食","长毛猫每日梳毛、每周化毛膏，吃化毛粮辅助","持续频繁、带血、伴精神差就医，排除真正的胃肠/系统病"]},"diarrhea:gia":{"intro":"贾第虫经被污染的水/粪口传播，幼猫群养高发。","care":["环境彻底清洁消毒、勤换猫砂","治疗期隔离、处理粪便戴手套","可益生菌+易消化饮食辅助","治疗后复查粪便确认清除"]},"diarrhea:tf":{"intro":"三毛滴虫经粪口传播，年轻群养猫高发，易复发。","care":["严格按14天足疗程、勿自行加量/加频(神经毒)","环境清洁干燥、降低密度","可加可溶性纤维/益生菌","走路不稳/抽搐立即停药就医"]},"diarrhea:coc":{"intro":"球虫经粪口/污染环境传播，幼猫断奶或换环境后高发。","care":["环境每日清洁、粪便及时清除","开水/蒸汽消毒(卵囊耐普通消毒剂)","隔离患猫、补液防脱水","同窝同治"]},"diarrhea:are":{"intro":"肠道菌群失衡相关的慢性腹泻，对特定抗生素反应良好。","care":["配合高消化率/水解蛋白饮食","可长期低剂量维持、按需调整","补充益生菌/益生元","避免频繁换粮"]},"diarrhea:ibd":{"intro":"免疫介导的慢性肠道炎症，病因复杂，需活检确诊。","care":["水解蛋白/新型蛋白处方粮","激素需缓慢减量、勿骤停","监测体重、血糖(长期激素)","定期复查、调整方案"]},"diarrhea:diet":{"intro":"换粮过快、食物过敏/不耐受、偷吃零食或异物等饮食原因引起的腹泻，多自限；新猫到家、换粮、加餐零食是高发场景。","care":["严格 7 日渐进换粮(1/4→1/2→3/4→全)","换粮期记录每餐内容，便于排查过敏原","禁止人食、突然加零食/加蛋黄等","可加益生菌过渡、保证饮水","试粮(水解/低敏)期间必须单一处方粮，勿掺杂"]},"appetite:stim":{"intro":"食欲下降多是其他病的信号，需先查病因；猫长期不吃易脂肪肝。","care":["先查并治原发病，促食欲只是辅助","加热湿粮增香、安静环境喂食","严重不吃需鼻饲/食管管饲","记录每日进食量与体重"]},"urine:fic":{"intro":"应激相关的无菌性膀胱炎，与多猫冲突、环境改变、肥胖少动有关，易反复。","care":["增加饮水(湿粮、流动水)、增设猫砂盆(N+1)","减少应激、丰容、用费洛蒙","控制体重、鼓励运动","公猫警惕完全尿闭—急症"]},"urine:uti":{"intro":"细菌性尿路感染，多见于老年、糖尿病、CKD猫。","care":["按培养结果足疗程用药","多饮水、保持猫砂清洁","控制基础病(糖尿病/CKD)","复查尿液确认清除"]},"urine:pye":{"intro":"细菌上行至肾脏的感染，可损伤肾功能，属较重感染。","care":["足疗程(常4–6周)、勿提前停","多饮水、监测肾功能","控制基础病","发热精神差需就医"]},"urine:stone":{"intro":"尿结晶/结石，与饮食、尿pH、饮水不足有关。","care":["按结石类型选处方粮、严格喂食","大量增加饮水","定期复查尿液与影像","公猫结石易堵塞—警惕尿闭"]},"ckd:prot":{"intro":"肾小球受损致蛋白漏出，加速肾病进展。","care":["肾处方粮(限磷、适量优质蛋白)","保证饮水、避免脱水","定期复查UPC/血压/肾功","避免肾毒性药物"]},"ckd:htn":{"intro":"CKD常并发高血压，可致视网膜出血/失明、加重心肾损伤。","care":["每日规律降压药、定期测血压","低钠饮食","突然失明需急诊","监测肾功能/电解质"]},"ckd:ane":{"intro":"肾脏促红素分泌不足导致贫血，病程进展常见。","care":["EPO类需配合补铁","监测HCT与血压","营养支持、减少应激","注意黑便/出血(会加重贫血)"]},"ckd:nau":{"intro":"尿毒素蓄积刺激引起恶心呕吐、食欲差。","care":["止吐+护胃+促食欲","少量多餐、加热增香","保证饮水、必要时皮下补液","定期复查"]},"skin:flea":{"intro":"跳蚤叮咬及其唾液过敏(FAD)，环境中虫卵幼虫是主要来源。","care":["所有同居猫狗同时驱蚤","彻底清洁环境(吸尘、洗烫窝垫)","持续每月驱虫≥3个月断代","禁用狗用含氯菊酯产品(对猫致命)"]},"skin:mite":{"intro":"疥螨/耳螨/蠕形螨等寄生，接触传染(耳螨幼猫常见)。","care":["同居动物同治、环境清洁","耳螨先清理耳道再上药","勿与其他猫共用美容工具","按疗程复查刮片"]},"skin:fung":{"intro":"皮肤癣菌(猫癣)，人畜共患；接触患猫或孢子污染环境传播，免疫低/幼猫高发。","care":["隔离患猫、限制活动范围","环境反复消毒、清除脱落毛发(孢子顽固)","接触后洗手；家人长癣就医","口服+药浴并用，到2次培养阴性才停"]},"skin:allerg":{"intro":"特应性/食物/环境过敏导致，瘙痒-舔抓恶性循环。","care":["排查并回避过敏原(食物试验/环境)","防过度舔抓(伊丽莎白圈)","环境除螨除尘","必要时长期免疫调节，勿长期大剂量激素"]},"abscess:abs":{"intro":"多由打架咬伤，细菌(常含厌氧菌)在皮下繁殖成脓。","care":["脓肿成熟需切开引流+冲洗","保持伤口清洁、勿自行挤压","按疗程抗生素","绝育减少打架；户外猫风险高"]},"cardio:chf":{"intro":"心肌病等致心衰、肺/胸腔积液，属急症，不可治愈只能控制。","care":["绝对静养、避免应激与剧烈活动","严格按利尿剂，监测静息呼吸频率(>40偏高)","低钠饮食","定期复查心超/肾功能/电解质"]},"cardio:ate":{"intro":"心脏内血栓脱落堵塞后肢动脉(鞍栓)，剧痛、瘫痪，极凶险。","care":["立即就医镇痛+抗栓，勿热敷/按摩患肢","长期抗血小板预防复发","治疗基础心脏病","预后谨慎，与兽医充分沟通"]},"cardio:hcm":{"intro":"肥厚型心肌病伴流出道梗阻/心律失常，部分品种有遗传倾向。","care":["避免应激与剧烈运动","规律用药、定期复查心超","注意呼吸与活动耐量变化","种猫建议做心脏筛查"]},"dm:dm":{"intro":"胰岛素相对不足致高血糖，与肥胖、饮食、品种有关，早期规范治疗部分可缓解。","care":["定时定量喂食(高蛋白低碳水)、规律打针","家庭血糖监测、记录曲线","减重、增加运动","严防低血糖(发抖/抽搐立即喂糖并就医)"]},"dm:dka":{"intro":"糖尿病失控的致命并发症，常由感染/漏打诱发。","care":["立即住院抢救，勿在家处理","稳定后规律胰岛素+监测","治疗诱因(感染等)","定期复查"]},"hyper:hyper":{"intro":"甲状腺良性增生致激素过多，老年猫常见；可药物/碘131/手术治疗。","care":["规律服药、定期复查T4与肾功能","保证营养(高代谢消耗大)","监测体重/心率/血压","碘131可根治，条件允许可考虑"]},"pain:oackd":{"intro":"老年退行性关节炎，合并肾病时不能用消炎止痛药。","care":["首选单抗镇痛(Solensia)、加巴喷丁","家居改造：低边猫砂盆、台阶、防滑、保暖","控制体重、适度活动","定期复查肾功能"]},"pain:oa":{"intro":"关节软骨退化致慢性疼痛，肥胖、年龄、既往损伤是诱因。","care":["低剂量NSAID须充分饮水、监测肾","减重、关节保健品(omega-3/软骨素)","家居改造便于活动","避免肥胖与过度跳跃硬着陆"]},"pain:acute":{"intro":"外伤或手术造成的急性疼痛。","care":["按医嘱镇痛、限制活动休息","伤口清洁防舔(伊丽莎白圈)","观察食欲/排泄/精神","勿自行用人用止痛药(致命)"]},"neuro:epi":{"intro":"反复发作的脑神经异常放电，可原发或继发(中毒/肝病/脑病)。","care":["规律服药勿漏勿骤停、定期监测","发作时移开危险物、勿塞嘴、记录时长","避免诱因(应激/缺觉/漏药)","持续>5分钟立即就医"]},"neuro:anx":{"intro":"对陌生环境/出行的应激反应，并非疾病。","care":["提前在家适应航空箱、垫主人气味","出行前按需镇静、避免空腹过久","保持安静、覆盖航空箱减少视觉刺激","回家后给安静空间恢复"]},"neuro:beh":{"intro":"长期焦虑/territorial标记/冲突相关行为，常与多猫资源竞争有关。","care":["资源充足分散(食/水/猫砂/休息位 N+1)","费洛蒙、丰容、规律互动","标记处用酶清洁剂(防再标记)","药物数周起效，配合行为训练、勿骤停"]},"sepsis:abs":{"intro":"局部化脓性感染(多为咬伤脓肿)，全身状况尚可。","care":["引流+清创+抗生素","保持伤口清洁、戴圈防舔","观察是否发热/扩散","绝育减少打架"]},"sepsis:sep":{"intro":"感染扩散入血的全身重症，死亡风险高。","care":["立即住院，静脉抗生素+液体复苏","密切监护生命体征/血乳酸","积极支持(保暖/营养/镇痛)","尽快依培养调整用药"]},"sepsis:mdr":{"intro":"多重耐药菌感染，常见于院内或反复用药后，治疗困难。","care":["严格依药敏用药、足疗程","接触隔离、勤手卫生防院内传播","保留药仅必要时用","平时避免滥用抗生素"]},"fip:wet":{"intro":"猫冠状病毒在体内变异引发的免疫介导性炎症，多见断奶后幼猫；应激/高密度增加风险。曾被视为绝症，现可治。","care":["全程84天不可中断、每周称重调量","用药期监测CBC/生化/AGP","降低应激、营养支持、隔离观察","停药后观察12周防复发"]},"fip:dry":{"intro":"FIP的非渗出型，在器官形成肉芽肿，诊断较难。","care":["足疗程治疗、定期复查","营养与支持治疗","降低应激","与兽医密切随访"]},"fip:neu":{"intro":"FIP累及神经/眼，需更高剂量药物穿过血脑屏障。","care":["按高剂量足疗程、勿擅自减量","监测神经症状变化","营养与护理支持","随访影像/眼科评估"]},"parasite:prev":{"intro":"日常预防体内外寄生虫，保护猫与家人(部分人畜共患)。","care":["按月规律使用、勿漏","多宠家庭同步驱虫","禁用狗用含氯菊酯产品","滴剂后2小时勿洗澡/舔舐"]},"parasite:tape":{"intro":"绦虫多由误食带蚤或猎物感染，可见肛门米粒样节片。","care":["驱绦同时必须灭蚤(根本来源)","控制户外捕猎","环境清洁","定期粪检"]},"abort:fpv":{"intro":"猫瘟病毒可致孕猫流产/死胎，高度传染、环境耐受强。","care":["孕前完成免疫(用灭活苗)、引种检疫","爆发时全群隔离、含氯/过硫酸氢钾消毒","病猫支持治疗、防继发","康复猫排毒数周，需隔离"]},"abort:fhv":{"intro":"疱疹病毒可致妊娠中期(5–6周)流产，多继发于母猫上呼吸道感染。","care":["孕前接种、控制母猫呼吸道病","降低猫舍密度与应激","隔离患猫","保暖通风"]},"abort:retro":{"intro":"FeLV/FIV可致流产/吸收/不孕，经唾液/血/母婴传播。","care":["引种必检、阳性退出繁育或隔离","不让阳性猫繁育","FeLV可疫苗预防","定期筛查全群"]},"abort:chl":{"intro":"衣原体/支原体可致繁殖障碍，常伴结膜炎/上呼吸道，接触传播。","care":["足疗程治疗(孕期用药需兽医权衡)","隔离、同群评估","改善通风与密度","注意可感染人结膜"]},"abort:metr":{"intro":"子宫细菌感染/蓄脓，发情后高发，可危及生命。","care":["闭合性/重症首选绝育手术","非种用母猫建议绝育预防","按药敏抗生素","脓性分泌+精神差立即就医"]},"abort:prog":{"intro":"黄体功能不足致孕酮过低，胚胎无法维持。","care":["须兽医监测孕酮精确补充","用药/停药时机严格(过量致畸/难产)","非常规自行用药","查找并排除其他流产病因"]},"fading:hhh":{"intro":"新生猫体温调节与血糖储备差，受凉或吃奶不足会迅速恶化，是新生儿死亡主因。","care":["保温(育儿箱30–32℃)、缓慢复温","少量多次喂奶、每日称重监测","低体温先复温再喂(勿喂冷奶)","环境安静、母猫照护或人工接管"]},"fading:fni":{"intro":"母B型×仔A型时，初乳抗体破坏幼猫红细胞，出生24–48h内发病。","care":["种猫全部血型鉴定、避免危险配对","高危幼猫48h内禁哺该母猫、人工喂养","48h后可回归母猫","好发布偶/英短/德文卷毛等"]},"fading:neosep":{"intro":"新生猫经脐带/产道/环境感染细菌入血，进展极快。","care":["脐带消毒(碘伏)、产房清洁","保温补液+β-内酰胺抗生素","确保初乳摄入(被动免疫)","避免氨基糖苷/氟喹诺酮/四环素"]},"fading:asp":{"intro":"奶呛入气管/肺，多因人工喂养手法不当或腭裂、虚弱吞咽差。","care":["正确喂养：俯卧、奶速慢、勿仰头灌","呛奶后拍背、必要时吸氧","排查腭裂等先天缺陷","氧疗+抗生素，严重需管饲"]},"fading:cong":{"intro":"先天发育异常(腭裂、心脏畸形等)或低出生体重。","care":["对症支持、必要时手术(如腭裂)","保温营养、密切监测","评估生活质量","遗传相关应调整配种计划"]},"ear:mite":{"intro":"耳螨经接触传染，幼猫与多猫家庭高发，剧痒、黑色耳垢。","care":["同居动物同治","先清理耳道再上药、按疗程","勿与其他猫共用美容工具","复查确认清除"]},"ear:exoto":{"intro":"细菌或马拉色菌引起的外耳道感染，常继发于耳螨、潮湿、过敏。","care":["先做细胞学定性再选药","清理+滴耳药、按疗程","保持耳道干燥","反复发作查过敏/螨等根本原因"]},"ear:vest":{"intro":"内耳/前庭受累(感染、息肉等)致歪头失衡，需就医。","care":["尽快就医、影像评估","防摔伤、限制高处活动","按医嘱抗感染/手术","勿自行掏耳"]},"mouth:perio":{"intro":"牙菌斑、牙结石致牙周炎/牙吸收，口臭、牙龈红、进食痛。","care":["洁牙/拔牙是根治，日常刷牙/洁齿","软食过渡、镇痛","抗生素仅围手术期短期","定期口腔检查"]},"mouth:stoma":{"intro":"免疫异常引起的慢性龈口炎，口腔后部弥漫剧痛，病因复杂。","care":["全口/后磨牙拔除最有效","免疫调节/激素或环孢素维持","流食、强力镇痛","定期复查、耐心长期管理"]},"mouth:fcv":{"intro":"杯状病毒可致口腔溃疡，高度接触传染。","care":["软糊食物+镇痛","隔离消毒(含氯)","保证进食饮水","群体重视疫苗"]},"mouth:renu":{"intro":"慢性肾病尿毒素致口腔溃疡，见于老年肾病猫。","care":["以治疗肾病为本(见喝多尿多章)","口腔护理+护胃止吐","软食、保证饮水","定期复查肾指标"]},"lethargy:infect":{"intro":"发热性感染/炎症会让猫精神差、躲藏，需查因。","care":["先就医测体温、血常规","保暖、补水、安静休息","勿自行用药掩盖病情","明确病原后针对治疗"]},"lethargy:anemia":{"intro":"贫血(失血/溶血/肾性等)致乏力、黏膜苍白。","care":["尽快就医查血常规与病因","减少应激与活动","注意黑便/出血","按病因治疗，重症需输血"]},"lethargy:organ":{"intro":"肾/肝/胰/糖尿等内脏代谢病常以精神差、消瘦起病。","care":["查生化定位、对症处理(见对应章)","保证饮水营养","定期复查","避免肾毒/肝毒药物"]},"lethargy:pain":{"intro":"关节、口腔、腹腔等隐痛会表现为躲藏、不爱动。","care":["就医定位疼痛来源","镇痛须兽医(勿用人药)","家居改造便于活动","观察食欲与排泄"]},"lethargy:emergcrit":{"intro":"中毒、低血糖、休克、内出血等危重情况，刻不容缓。","care":["立即送医，记录可疑接触物","保暖、勿喂食喂水(防误吸)","勿自行催吐/喂药","携带可疑毒物包装就医"]},"jaundice:hepa":{"intro":"肝胆疾病(胆管炎、肝脂沉积等)致胆红素升高、发黄；长期厌食可诱发肝脂沉积。","care":["强制/管饲营养是肝脂沉积关键","补液、护肝、必要 function confG(gid){var p=1,any=false;selKeys().forEach(function(k){var cl=GBYKEY[k];if(cl&&(cl.m===ST.mode||cl.m==='both')){var w=cl.w[gid];if(w){any=true;p*=(1-Lw(w));}}});return any?1-p:0;}

function renderDetail(){
 var s=DATA[ST.i];
 var html='<button class="back" onclick="APP.home()">‹ 全部症状</button>';
 html+='<div class="dh"><h2>'+esc(s.title)+'</h2></div>';
 if(s.emerg)html+='<div class="emerg">🚨 '+esc(s.emerg)+'</div>';
 var st=1;
 html+='<div class="step"><span class="n">'+(st++)+'</span><span class="t">你打算怎么办</span></div>';
 html+='<div class="seg"><button class="'+(ST.mode==='home'?'on':'')+'" onclick="APP.mode(\'home\')">🏠 在家观察</button><button class="'+(ST.mode==='vet'?'on':'')+'" onclick="APP.mode(\'vet\')">🏥 准备就医</button></div>';

   html+='<div class="step"><span class="n">'+(st++)+'</span><span class="t">推荐做的检查</span><span class="sub">到医院做这些，帮助确诊</span></div>';
   html+='<div class="exams">'+s.vetExams.split(/[+、]/).map(function(x){x=x.trim();if(!x)return '';var pri='rec',lbl='建议';var m=x.match(/^\[(必|荐|选)\]/);if(m){if(m[1]==='必'){pri='must';lbl='应做';}else if(m[1]==='荐'){pri='rec';lbl='建议';}else{pri='opt';lbl='可选';}x=x.replace(/^\[[必荐选]\]/,'');}return '<span class="exam ex-'+pri+'"><b class="prio">'+lbl+'</b><span>'+esc(x)+'</span></span>';}).join('')+'</div>';
 }
 var selCount=0;Object.keys(ST.sel).forEach(function(k){if(ST.sel[k])selCount++;});
 var capCls=selCount>=MAX_CLUES?' cap':'';
 html+='<div class="step"><span class="n">'+(st++)+'</span><span class="t">勾选线索'+(ST.mode==='vet'?'（指标）':'')+'</span><span class="sub'+capCls+'">已选 '+selCount+' / '+MAX_CLUES+' · 本症状 + 可加其他</span></div>';
 if(ST.flashMsg)html+='<div class="flash">'+esc(ST.flashMsg)+'</div>';
 function isLocked(o){if(ST.sel[o.key])return false;if(o.xg){var b=false;Object.keys(ST.sel).forEach(function(sk){if(!ST.sel[sk])return;var so=GBYKEY[sk];if(so&&so.symId===o.symId&&so.xg===o.xg)b=true;});if(b)return true;}return false;}

   if(o.m!=='both'&&o.m!==ST.mode)return '';
   var lk=isLocked(o);
   return '<button class="chip'+(ST.sel[o.key]?' on':'')+(lk?' locked':'')+'" onclick="APP.clue(\''+o.key+'\')">'+esc(o.t)+'</button>';
 }).join('')+'<button class="chip add" onclick="APP.togglePicker()">'+(ST.picker?'× 收起':'＋ 其他症状的线索')+'</button></div>';
 if(ST.picker)html+=renderPicker(s);
 var added=selKeys().filter(function(k){return GBYKEY[k]&&GBYKEY[k].symId!==s.id;});
 if(added.length)html+='<div class="added"><span class="lbl">已添加：</span>'+added.map(function(k){var o=GBYKEY[k];return '<button class="chip on" onclick="APP.clue(\''+k+'\')">'+esc(o.t)+'<span class="clueorigin">'+esc(o.sym)+'</span> ✕</button>';}).join('')+'</div>';
 html+='<div class="hint">一个线索可指向多个病因；可跨症状自由组合，勾得越多越准。</div>';
 var anySel=selKeys().some(function(k){var o=GBYKEY[k];return o&&(o.m===ST.mode||o.m==='both');});
 html+='<div class="step"><span class="n">'+(st++)+'</span><span class="t">可能的病因</span><span class="sub">'+(anySel?'综合所有线索 · 按可能性排序':'勾选线索后显示')+'</span></div>';
 if(!anySel){ html+='<div class="placeholder">请先勾选你观察到的线索（可跨症状添加），我会综合估算各病因的可能性。</div>'; }
 else {
   var scored=Object.keys(GCAUSES).map(function(g){return {g:g,sc:confG(g)};});
   var list=scored.filter(function(o){return o.sc>0;}).sort(function(a,b){return b.sc-a.sc;});
   html+='<div class="causes">'+list.map(function(o,ri){
     var g=o.g,gc=GCAUSES[g];var pct=Math.round(o.sc*100);var emg=(gc.em||gc.hx==='急症');
     var op=ST.open===g;
     var h='<div class="cz'+(op?' open':'')+'"><div class="head" onclick="APP.cause(\''+g+'\')">';
     h+='<span class="rank">'+(ri+1)+'</span><div class="nmwrap"><div class="nm">'+(emg?'<span class="em-tag">🚨</span>':'')+esc(gc.name)+'<span class="systag">'+esc(gc.sym)+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
     h+='<span class="ptag">可能性 '+pct+'%</span><span class="chev">›</span></div>';
     if(op){
       var ann=CARE[gc.symId+':'+gc.cid]||{};
       var et2=ETIO[gc.symId+':'+gc.cid];
       if(ann.intro)h+='<div class="cintro">'+esc(ann.intro)+'</div>';
       if(et2)h+=renderEtio(et2,true);
       h+='<div class="crel">可靠度参考：<b>就医确诊 '+gc.dx+'</b> ｜ 居家研判 '+(gc.hx==='急症'?'急症':gc.hx)+'</div>';
       if(ST.mode==='home'&&emg){h+='<div class="emo"><div class="box">这是急症，居家无法处理 → 请立即送医。下方用药仅供你了解，须由兽医在医院执行。</div></div>';}
       h+='<div class="drugs">'+gc.drugs.map(function(d){
         return '<div class="drug '+(d.risk||'na')+'"><div class="dt"><span class="dn">'+esc(d.n)+'</span>'+(d.en?'<span class="de">'+esc(d.en)+'</span>':'')+'<span class="cure">'+esc(d.cure)+'</span></div><div class="dm">'+esc(d.dose)+' · 疗程 '+esc(d.dur)+'</div>'+(d.note?'<div class="dnt">'+esc(d.note)+'</div>':'')+'</div>';
       }).join('')+'</div>';
       if(ann.care&&ann.care.length)h+='<div class="care"><div class="ct">🩺 护理与注意事项</div><ul>'+ann.care.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
     }
     h+='</div>';return h;
   }).join('')+'</div>';
 }
